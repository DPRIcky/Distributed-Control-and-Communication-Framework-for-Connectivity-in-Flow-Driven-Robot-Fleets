[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consensus-baseline"
version = "0.1.0"
description = "Headless consensus-based adjacency pruning for underwater robot swarms"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Prajj", email = "prajj@asu.edu"},
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "matplotlib",
]

[tool.setuptools.packages.find]
include = [
    "consensus_baseline*",
    "config*",
    "simulation*",
    "consensus*",
    "controllers*",
    "core*",
    "graph*",
    "utils*",
]

[project.scripts]
consensus-smoke = "consensus_baseline.run_smoke_test:main"
